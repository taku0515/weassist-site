<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="小さく作って段階的に育てる開発">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgC)"/>
  <circle cx="360" cy="220" r="20" fill="#CFFAFE"/>

  <!-- 成長カーブ（点線） -->
  <path d="M60 96c80-52 200-56 268 8" fill="none" stroke="#60A5FA" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M322 88l14 14-20 4z" fill="#2563EB"/>

  <!-- ウィンドウ 小（プロトタイプ） -->
  <g>
    <rect x="42" y="152" width="70" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5"/>
    <rect x="42" y="152" width="70" height="16" rx="8" fill="#94A3B8"/>
    <rect x="42" y="160" width="70" height="8" fill="#94A3B8"/>
    <rect x="52" y="178" width="36" height="7" rx="3.5" fill="#DBEAFE"/>
    <rect x="52" y="190" width="26" height="7" rx="3.5" fill="#E2E8F0"/>
  </g>

  <!-- ウィンドウ 中 -->
  <g>
    <rect x="150" y="126" width="100" height="82" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2.5"/>
    <rect x="150" y="126" width="100" height="20" rx="10" fill="#3B82F6"/>
    <rect x="150" y="136" width="100" height="10" fill="#3B82F6"/>
    <rect x="162" y="156" width="34" height="20" rx="5" fill="#DBEAFE"/>
    <rect x="204" y="156" width="34" height="20" rx="5" fill="#CFFAFE"/>
    <rect x="162" y="184" width="76" height="8" rx="4" fill="#E2E8F0"/>
  </g>

  <!-- ウィンドウ 大（完成へ） -->
  <g>
    <rect x="286" y="96" width="90" height="112" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <rect x="286" y="96" width="90" height="22" rx="10" fill="#1E293B"/>
    <rect x="286" y="108" width="90" height="10" fill="#1E293B"/>
    <rect x="296" y="128" width="70" height="24" rx="5" fill="#2563EB"/>
    <rect x="296" y="160" width="32" height="18" rx="5" fill="#DBEAFE"/>
    <rect x="334" y="160" width="32" height="18" rx="5" fill="#CFFAFE"/>
    <rect x="296" y="186" width="70" height="8" rx="4" fill="#E2E8F0"/>
    <!-- 完成チェック -->
    <circle cx="376" cy="96" r="16" fill="#06B6D4"/>
    <path d="M368 96l6 6 12-12" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ステップ矢印 -->
  <path d="M120 182h18m0 0l-7-7m7 7l-7 7" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M258 172h18m0 0l-7-7m7 7l-7 7" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 地面 -->
  <rect x="36" y="216" width="344" height="8" rx="4" fill="#CBD5E1"/>
</svg>
