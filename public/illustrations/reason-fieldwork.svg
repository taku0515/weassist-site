  </defs>
  <rect width="400" height="260" fill="url(#bgA)"/>
  <!-- 装飾 -->
  <circle cx="352" cy="40" r="26" fill="#DBEAFE"/>
  <circle cx="34" cy="212" r="16" fill="#CFFAFE"/>

  <!-- テーブル -->
  <rect x="90" y="178" width="220" height="14" rx="7" fill="#94A3B8"/>
  <rect x="110" y="192" width="12" height="42" rx="4" fill="#CBD5E1"/>
  <rect x="278" y="192" width="12" height="42" rx="4" fill="#CBD5E1"/>

