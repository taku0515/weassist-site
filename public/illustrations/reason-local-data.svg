<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="データを社外に出さないローカル構成">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgB)"/>
  <circle cx="46" cy="46" r="22" fill="#DBEAFE"/>

  <!-- 社屋（オフィス） -->
  <rect x="96" y="70" width="170" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="96" y="70" width="170" height="26" rx="12" fill="#1E293B"/>
  <rect x="96" y="84" width="170" height="12" fill="#1E293B"/>
  <!-- 窓 -->
  <rect x="116" y="112" width="28" height="24" rx="4" fill="#DBEAFE"/>
  <rect x="222" y="112" width="28" height="24" rx="4" fill="#DBEAFE"/>
  <rect x="116" y="146" width="28" height="24" rx="4" fill="#DBEAFE"/>
  <rect x="222" y="146" width="28" height="24" rx="4" fill="#DBEAFE"/>

  <!-- データベース（社内に保持） -->
  <g>
    <path d="M156 132h50v52c0 8-11 14-25 14s-25-6-25-14z" fill="#2563EB"/>
    <ellipse cx="181" cy="132" rx="25" ry="12" fill="#3B82F6"/>
    <ellipse cx="181" cy="152" rx="25" ry="12" fill="none" stroke="#93C5FD" stroke-width="3"/>
    <ellipse cx="181" cy="170" rx="25" ry="12" fill="none" stroke="#93C5FD" stroke-width="3"/>
  </g>

  <!-- 盾（保護） -->
  <g>
    <path d="M282 148l34-12 34 12v26c0 26-15 42-34 50-19-8-34-24-34-50z" fill="#06B6D4"/>
    <path d="M300 178l12 12 22-24" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- クラウド送信なし（禁止マーク付きクラウド） -->
  <g>
    <path d="M296 58a20 20 0 0 1 20-18 22 22 0 0 1 21 15 16 16 0 0 1-2 31h-52a15 15 0 0 1-2-29 18 18 0 0 1 15-0z" fill="#E2E8F0"/>
    <circle cx="312" cy="62" r="26" fill="none" stroke="#F43F5E" stroke-width="6"/>
    <line x1="294" y1="80" x2="330" y2="44" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 地面 -->
  <rect x="70" y="220" width="240" height="8" rx="4" fill="#CBD5E1"/>
</svg>
